<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <title>Money Manager</title>
    <!-- Installable web app: the manifest (name, icons, standalone display) is what Chrome and Edge need to offer
         "Install"; the apple-* tags do the same job for Safari's "Add to Home Screen", which ignores the manifest's
         icons. hrefs are absolute: Vite rewrites them with the configured base at build time, so the same file works
         at the root and under the GitHub Pages base path whatever route it is served from. Icons are generated by
         `npm run pwa-icons` (scripts/pwa-icons.mjs) from app/assets/icon-only.png. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money Manager" />
    <meta name="application-name" content="Money Manager" />
    <!-- Apply the saved theme before the first paint so dark mode never flashes light. Mirrors STORAGE_KEYS.settings.
         The theme-color meta (the browser's address bar) is set here too, from the same two --bdg-color-bg values as
         src/styles/tokens.css, so a dark tab does not flash a light bar until React runs (audit UI-26); data/settings.tsx
         keeps it in step at runtime. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('budget-app.settings.v1'));
        if (s && s.theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = '#121311';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
