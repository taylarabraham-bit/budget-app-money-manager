name: CI

# Every push to master and every pull request. `gates` is the fast one and is
# what should stay green; `sync-harness` drives a real browser, so it is kept
# separate - a flaky browser run must not hide a broken unit test.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The token only ever reads the repository (audit INF-10): a repo-level default
# flipped to read/write for another workflow must not hand this one write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On master every commit gets its own verdict, so a red one can be pinpointed
  # to the commit that caused it - several sessions push here minutes apart, and
  # cancelling the older run leaves those commits permanently unverified. On a
  # pull request only the tip matters, so a new push supersedes the run in
  # flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # A hung step must not burn the private repo's free minutes for six hours (audit INF-3).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` promises (20 reached end of life on 30 April 2026 - audit INF-5); 24 is what the dev machine runs.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Dates in this app are LOCAL calendar days ("a bill due on the 31st"),
      # and reading one as UTC midnight shifts it by a day for most of the
      # world. The runner is UTC by default, so the suite runs again under a
      # southern-hemisphere zone: a UTC-vs-local regression fails here even
      # when it passes above.
      - name: Test (Australia/Sydney)
        run: npm test
        env:
          TZ: Australia/Sydney

      - name: Build the design system
        run: npm run build

      - name: Build the app
        run: npm run app:build

  sync-harness:
    name: Sync race harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The unit gates are cheap; no point booting a browser if they are red.
    needs: gates

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The Node the team runs the harness on (audit INF-5).
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # nohup and a log file, not a bare `&`: the step's shell exits as soon as
      # the command is backgrounded, and the log is the only way to see why the
      # server never came up if the wait below times out.
      - name: Start the dev server
        run: nohup npm run dev > dev-server.log 2>&1 &

      - name: Wait for the dev server
        run: npx wait-on http://127.0.0.1:5173/harness/ --timeout 90000

      # Fourteen interleavings of a local edit against an applying pull. Fewer
      # iterations than a local run: these are deterministic, not statistical.
      - name: Run the harness
        run: node app/harness/run.mjs --iters 3 --out harness-results.json

      - name: Keep the results and the server log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: harness-results
          path: |
            harness-results.json
            dev-server.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a green master is published; a pull request or a manual run never
    # touches the live site.
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Pages needs write and an OIDC token to deploy; granted to this job alone so
    # the workflow-level read-only default keeps holding for the others.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancelled mid-way: a half-finished deploy
    # leaves the site in a state no commit ever produced.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The site lives under /<repo-name>/, so the build's base path must match
      # or every asset URL 404s. There is no .env.local on the runner, so the
      # published build carries no server address: sync stays off until a
      # server is entered in Settings.
      - name: Build the app for Pages
        run: npm run app:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Nothing unit-tests public/sw.js, so before the build goes live prove it
      # installs and opens offline the way an installed phone will see it
      # (scripts/pwa-check.mjs serves app/dist under the same base path).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove the build installs and opens offline
        run: npm run pwa-check -- --base /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
